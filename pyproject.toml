[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stickerkanmi"
version = "0.2.0"
description = "Lay out transparent images on printable sticker sheets with hand-cutting guide outlines"
requires-python = ">=3.11"
dependencies = [
    "pillow",
    "numpy",
    "opencv-python-headless",
    "shapely>=2.0",
    "cairosvg",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stickerkanmi = "stickerkanmi.cli:main"

[tool.setuptools]
packages = ["stickerkanmi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
